<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微小读设置</title>
  <link rel="stylesheet" href="options.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>微小读设置</h1>
    <label>
      <input id="show-reading-progress" type="checkbox" aria-describedby="progress-description" disabled>
      <span>显示全书剩余进度</span>
    </label>
    <p id="progress-description">在微信读书阅读页顶部显示整本书还剩多少。</p>
    <p id="settings-status" role="status"></p>
  </main>
</body>
</html>
